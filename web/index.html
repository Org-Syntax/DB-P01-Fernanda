<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suma rápida</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">Herramienta de cálculo</p>
    <h1>Suma rápida</h1>

    <form class="calculator" id="sum-form">
      <div class="fields">
        <div>
          <label for="first-number">Primer número</label>
          <input id="first-number" name="first-number" type="number" step="any" required>
        </div>
        <div>
          <label for="second-number">Segundo número</label>
          <input id="second-number" name="second-number" type="number" step="any" required>
        </div>
      </div>

      <button type="submit">Sumar</button>

      <div class="answer">
        <p class="answer-label">Resultado</p>
        <output id="sum-result" for="first-number second-number" aria-live="polite">—</output>
      </div>
    </form>
  </main>

  <script>
    const form = document.querySelector("#sum-form");
    const firstNumber = document.querySelector("#first-number");
    const secondNumber = document.querySelector("#second-number");
    const result = document.querySelector("#sum-result");
    const numberFormat = new Intl.NumberFormat("es-ES", { maximumFractionDigits: 10 });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      result.value = numberFormat.format(firstNumber.valueAsNumber + secondNumber.valueAsNumber);
    });
  </script>
</body>
</html>
